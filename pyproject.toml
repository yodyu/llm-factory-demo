[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-factory"
version = "0.3.0"
description = "Knowledge-enhanced agent factory for numeric monitoring detectors"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
    "jsonschema>=4,<5",
    "openai>=2,<3",
    "httpx>=0.28,<1",
    "neo4j>=5.26,<6",
    "langgraph>=1.2.18,<2",
]

[project.scripts]
factory = "factory.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]
demo = ["streamlit>=1.66.1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["case-example"]
force-exclude = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.package-data]
"factory.metrics" = ["graph_canvas.html"]
