services:
  neo4j:
    image: neo4j:5.26-community
    user: "${FACTORY_NEO4J_UID:?Run make neo4j first}:${FACTORY_NEO4J_GID:?Run make neo4j first}"
    ports:
      - "127.0.0.1:${FACTORY_NEO4J_HTTP_PORT:-7475}:7474"
      - "127.0.0.1:${FACTORY_NEO4J_BOLT_PORT:-7688}:7687"
    volumes:
      - neo4j-data:/data
      - ${FACTORY_NEO4J_AUTH_FILE:?Run make neo4j first}:/run/secrets/neo4j-auth:ro
    environment:
      NEO4J_AUTH_FILE: /run/secrets/neo4j-auth
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  neo4j-data:
