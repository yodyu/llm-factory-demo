name: L0
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make setup
      - run: .venv/bin/python -m pip install ruff==0.14.3
      - run: make test
        env:
          PYTHONPATH: src
      - name: Ruff on changed lines
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          .venv/bin/python scripts/ruff_changed.py --base "$BASE"
