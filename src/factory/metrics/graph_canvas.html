<!doctype html><html lang="zh"><meta charset="utf-8"><style>
*{box-sizing:border-box}body{font:14px system-ui;color:#263647;margin:0;background:#f4f7fa}header{padding:12px;border:1px solid #e1e7ed;border-radius:10px;line-height:2}button{background:white;border:1px solid #cdd8df;border-radius:6px;padding:6px 12px;color:#263647;cursor:pointer;margin-right:6px}main{display:grid;grid-template-columns:minmax(0,2fr) minmax(230px,1fr);height:590px;gap:12px;margin-top:12px}svg{width:100%;height:100%;background:white;border:1px solid #e1e7ed;border-radius:10px;touch-action:none}aside{padding:16px;background:white;border:1px solid #e1e7ed;border-radius:10px;overflow:auto;overflow-wrap:anywhere}text{font-size:12px;fill:#344759;pointer-events:none}.edge{stroke:#abb9c4;stroke-width:1.4}.node{cursor:grab;stroke:#fff;stroke-width:2}.dim{opacity:.15}.relation{font-size:10px;fill:#456179}h3{margin-top:0}dl{line-height:1.6}dt{color:#6c7d8c;font-size:12px;margin-top:10px}dd{margin:2px 0;white-space:pre-wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}#legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px}.swatch{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}#scope{font-size:12px;color:#627587}@media(max-width:650px){main{display:flex;flex-direction:column;height:auto}svg{height:450px;flex:none}aside{max-height:400px}}
</style><header><button id="minus" aria-label="缩小">−</button><button id="plus" aria-label="放大">＋</button><button id="fit">适应画布</button><button id="expand" disabled>展开关联</button><span id="scope"></span><div id="legend"></div></header>
<main><svg viewBox="0 0 820 590" id="svg" aria-label="实体关系图"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="18" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#8499ab"/></marker></defs><g id="scene"></g></svg><aside id="detail">选择实体查看详情。点击后高亮一跳邻居和带方向的关系；拖动节点调整位置，滚轮缩放。展开关联受100个实体上限及当前查询范围限制。</aside></main>
<script>const data=GRAPH_DATA;
const g=data.graph,usage=data.usage,svg=document.getElementById('svg'),scene=document.getElementById('scene'),detail=document.getElementById('detail');
const colors={Source:'#4381ba',Chunk:'#8bbbe0',Capability:'#a080c3',Constraint:'#8d99a6',Implementation:'#40a4ad',ValidationRun:'#e3b35e',Experience:'#6ba483',DataContract:'#6c93b9',Metric:'#bb8953',Environment:'#8a9c63'};
const names={Source:'来源',Chunk:'片段',Capability:'能力',Constraint:'约束',Implementation:'实现',ValidationRun:'验证',Experience:'经验',DataContract:'数据契约',Metric:'评价指标',Environment:'依赖环境'};
const kinds=Object.keys(colors),nodes=g.nodes.map((n,i)=>({...n,x:410+Math.cos(i*2.39996)*Math.sqrt(i+1)*34,y:295+Math.sin(i*2.39996)*Math.sqrt(i+1)*25})),byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
const initial=[];for(let i=0;i<nodes.length&&initial.length<Math.min(30,nodes.length);i++){for(const kind of kinds){const n=nodes.filter(n=>n.kind===kind)[i];if(n&&initial.length<30)initial.push(n.id)}}
for(const n of nodes){if(initial.length<30&&!initial.includes(n.id))initial.push(n.id)}
const layoutOrder=[...initial,...nodes.map(n=>n.id).filter(id=>!initial.includes(id))];for(const n of nodes){const i=layoutOrder.indexOf(n.id);n.x=90+(i%6)*128;n.y=65+Math.floor(i/6)*105}
let visible=new Set(initial),selected=null,dragged=null,zoom=1,tx=0,ty=0;
const storageKey='factory-graph:v3:'+JSON.stringify([g.scope,data.task_id,nodes.map(n=>n.id)]);
try{const saved=JSON.parse(sessionStorage.getItem(storageKey));if(saved){visible=new Set(saved.visible.filter(id=>byId[id]));selected=byId[saved.selected]?saved.selected:null;zoom=saved.zoom;tx=saved.tx;ty=saved.ty;for(const n of nodes){const xy=saved.positions[n.id];if(xy){n.x=xy[0];n.y=xy[1]}}}}catch{}
function persist(){try{sessionStorage.setItem(storageKey,JSON.stringify({visible:[...visible],selected,zoom,tx,ty,positions:Object.fromEntries(nodes.map(n=>[n.id,[n.x,n.y]]))}))}catch{}}

const ns='http://www.w3.org/2000/svg';
function elem(t,a,text){const e=document.createElementNS(ns,t);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;scene.append(e);return e;}
function label(n){let p=n.payload;return String(p.name||p.title||p.path||p.description||p.method_id||p.config?.method_id||p.issue||(n.kind==='Chunk'?p.text?.split('\n')[0]:null)||names[n.kind]+' · '+n.id.slice(-6)).split('/').pop()}
function affected(v){return v?.protocol==='metrics-method-check/1'&&v.checks?.some(c=>['STATE_RELOAD_DIFFERENCE','RESET_PREFIX_DIFFERENCE'].includes(c.difference?.code))}
function checksFor(n){if(n.payload.method_checks)return n.payload.method_checks;let id=n.payload.validation_id;if(n.kind==='Implementation')id=g.relations.find(r=>r.source===n.id&&r.relation==='EVALUATED_BY')?.target;return byId[id]?.payload.method_checks}
function status(n){const p=n.payload,v=checksFor(n);let check=v?.passed;if(n.kind==='Experience'&&check===undefined)check=p.implementation_verified===true?true:p.issue==='method_check_failure'?false:undefined;if(affected(v))return ['旧验证器判定待复验','#8795a2'];if(check===false||p.engineering_status==='FAILED'||p.execution_status==='FAILED')return ['失败','#c65b59'];if(check===true||p.engineering_status==='PASSED')return ['检查通过','#308564'];if(p.effect_status==='NOT_MEASURED')return ['未测量','#8795a2'];return ['未验证','#8795a2']}
function transform(){scene.setAttribute('transform',`translate(${tx},${ty}) scale(${zoom})`);persist()}
function draw(){scene.replaceChildren();const adjacent=new Set(selected?[selected]:[]);for(const r of g.relations)if(r.source===selected||r.target===selected){adjacent.add(r.source);adjacent.add(r.target)}
for(const r of g.relations){let a=byId[r.source],b=byId[r.target];if(!a||!b||!visible.has(a.id)||!visible.has(b.id))continue;let near=r.source===selected||r.target===selected;elem('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,class:'edge'+(selected&&!near?' dim':''),'marker-end':'url(#arrow)',style:near?'stroke:#456179;stroke-width:2.4':''});if(near)elem('text',{x:(a.x+b.x)/2,y:(a.y+b.y)/2-5,class:'relation'},r.relation+' →')}
for(const n of nodes){if(!visible.has(n.id))continue;let [state,color]=status(n),dim=selected&&!adjacent.has(n.id);let c=elem('circle',{cx:n.x,cy:n.y,r:13,fill:colors[n.kind]||'#aaa',class:'node'+(dim?' dim':''),style:n.id===selected?'stroke:#263647;stroke-width:4':(usage.cited||[]).includes(n.id)?'stroke:#526a83;stroke-width:3':''});let title=document.createElementNS(ns,'title');title.textContent=label(n)+' · '+state;c.append(title);c.addEventListener('pointerdown',e=>{selected=n.id;dragged=n;svg.setPointerCapture(e.pointerId);show(n);draw()});elem('circle',{cx:n.x+10,cy:n.y-10,r:4,fill:color,class:dim?'dim':''});elem('text',{x:n.x,y:n.y+29,'text-anchor':'middle',class:dim?'dim':''},label(n).slice(0,9)+(label(n).length>9?'…':''))}
document.getElementById('scope').textContent=`显示 ${visible.size} / ${nodes.length} 个查询实体 · 有界3跳局部关系 · 上限100`;document.getElementById('expand').disabled=!selected;transform()}
function add(t,text,parent=detail){let e=document.createElement(t);e.textContent=text;parent.append(e);return e}
function show(n){detail.replaceChildren();add('h3',label(n));const p=n.payload,dl=add('dl','');function field(k,v){if(v===undefined||v===null)return;add('dt',k,dl);add('dd',typeof v==='object'?JSON.stringify(v,null,2):String(v),dl)}
field('类型',names[n.kind]+' · '+n.kind);if(affected(checksFor(n)))add('p','原始判定受旧验证器 v1 缺陷影响，需使用 v2 独立复验。');field('验证状态',status(n)[0]);field('效果状态',p.effect_status);field('业务验收',p.acceptance_status);if(p.task_id&&data.task_id===p.task_id&&p.candidate_id)field('候选采用状态',data.selected_candidate?p.candidate_id===data.selected_candidate?'已采用':'未采用':'未记录选择');field('完整名称',label(n));if(p.task_id&&data.task_id===p.task_id&&!p.candidate_id&&p.implementation_id){let impl=byId[p.implementation_id]?.payload;if(impl?.candidate_id)field('候选采用状态',data.selected_candidate?impl.candidate_id===data.selected_candidate?'已采用':'未采用':'未记录选择')}
const fields={Source:['path','material_type','origin','source_status'],Chunk:['start_line','end_line','text'],Capability:['method_id','version','task_type','inputs','outputs','parameters','algorithm_spec','spec_sources','evaluation_metrics','supported_directions','verification_level','field_evidence','conditions_status','metric_kinds','min_history','constraints','limitations'],Constraint:['type','conditions','description'],Implementation:['config','version','origin','dependency_profile','capability_id','capability_version','specification_sha256','verification_level','source_sha256'],ValidationRun:['protocol','method_checks','final','development'],Experience:['method_id','issue','action','outcome','reuse_scope','reusable_implementation'],DataContract:['name','definition','citations'],Metric:['name','definition','citations'],Environment:['name','definition','citations']};const labels={path:'来源路径',material_type:'材料类型',origin:'来源模式',source_status:'来源状态',source_id:'来源',start_line:'起始行',end_line:'结束行',text:'原文',method_id:'算法方法',conditions_status:'条件状态',metric_kinds:'适用指标',min_history:'最少历史',constraints:'适用约束',limitations:'限制',type:'约束类型',conditions:'适用条件',description:'说明',version:'版本',task_type:'任务类型',inputs:'输入结构',outputs:'输出结构',parameters:'参数结构',algorithm_spec:'算法规格',spec_sources:'规格材料引用',evaluation_metrics:'评价指标',supported_directions:'支持方向',verification_level:'验证等级',field_evidence:'逐字段引用',capability_id:'能力ID',capability_version:'能力版本',specification_sha256:'规格摘要',source_sha256:'源码摘要',config:'实现配置',definition:'定义',citations:'来源引用',name:'名称',dependency_profile:'依赖',protocol:'验证协议',method_checks:'工程检查',final:'最终验证结果',development:'开发验证',issue:'经验问题',action:'处理措施',outcome:'经验结论',reuse_scope:'适用范围',reusable_implementation:'获准重新验证后复用'};
const sourceIds=new Set();function sources(id,depth){if(depth>3)return;const item=byId[id];if(item?.kind==='Source'){sourceIds.add(item.payload.path||label(item));return}for(const r of g.relations)if(r.source===id&&r.relation==='DERIVED_FROM')sources(r.target,depth+1)}sources(n.id,0);if(p.source_id&&byId[p.source_id])sources(p.source_id,0);if(sourceIds.size)field('来源',[...sourceIds]);
for(const k of fields[n.kind]||[])field(labels[k]||k,p[k]);let relations=g.relations.filter(r=>r.source===n.id||r.target===n.id);add('h4','相邻关系');for(const r of relations)add('p',`${r.source===n.id?'→':'←'} ${r.relation} · ${byId[r.source===n.id?r.target:r.source]?label(byId[r.source===n.id?r.target:r.source]):'范围外实体'}`);
let raw=add('details','');add('summary','原始证据',raw);add('pre',JSON.stringify({id:n.id,kind:n.kind,payload:p,provided:(usage.supplied||[]).includes(n.id),cited:(usage.cited||[]).includes(n.id),relations},null,2),raw)}
svg.addEventListener('pointermove',e=>{if(!dragged)return;let p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;p=p.matrixTransform(scene.getScreenCTM().inverse());dragged.x=p.x;dragged.y=p.y;draw()});svg.addEventListener('pointerup',()=>dragged=null);svg.addEventListener('pointercancel',()=>dragged=null);
function scale(f){let next=Math.max(.25,Math.min(4,zoom*f));tx=410-(410-tx)*next/zoom;ty=295-(295-ty)*next/zoom;zoom=next;transform()}
for(const [id,f]of [['plus',1.2],['minus',1/1.2]])document.getElementById(id).onclick=()=>scale(f);svg.addEventListener('wheel',e=>{e.preventDefault();scale(e.deltaY<0?1.1:1/1.1)},{passive:false});document.getElementById('fit').onclick=()=>{const shown=nodes.filter(n=>visible.has(n.id));if(!shown.length)return;let xs=shown.map(n=>n.x),ys=shown.map(n=>n.y),minX=Math.min(...xs)-60,maxX=Math.max(...xs)+60,minY=Math.min(...ys)-45,maxY=Math.max(...ys)+45;zoom=Math.min(820/(maxX-minX),590/(maxY-minY),2);tx=(820-(minX+maxX)*zoom)/2;ty=(590-(minY+maxY)*zoom)/2;transform()};
function reveal(id){if(!byId[id]||visible.has(id)||visible.size>=100)return;const i=visible.size;byId[id].x=90+(i%6)*128;byId[id].y=65+Math.floor(i/6)*105;visible.add(id)}
document.getElementById('expand').onclick=()=>{let count=visible.size;for(const r of g.relations)if(r.source===selected||r.target===selected){reveal(r.source);reveal(r.target)}draw();if(visible.size===count)add('p','当前查询范围内的关联已全部显示。范围外关联未加载；本图最多100个实体。')};
const legend=document.getElementById('legend');for(const k of kinds){let e=add('span','',legend),sw=add('i','',e);sw.className='swatch';sw.style.background=colors[k];e.append(document.createTextNode(names[k]))}add('span','● 独立状态标记：绿 检查通过 / 红 失败 / 灰 未验证或未测量',legend);draw();if(selected)show(byId[selected]);
</script></html>
